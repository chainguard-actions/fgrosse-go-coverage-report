name: Test trim input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.0"
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"
          trim: "github.com/myorg/myrepo/"
          target-branch: "main"
      - name: Assert action ran (trim input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to missing artifact/GitHub API, but it must not
          # fail because of an unrecognized 'trim' input. Any outcome is acceptable.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: trim input was accepted by the action"
