name: Test custom version input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with explicit version v1.3.1
        id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.1"
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"

      - name: Assert go-coverage-report binary v1.3.1 was installed
        run: |
          if ! command -v go-coverage-report > /dev/null 2>&1; then
            echo "FAIL: go-coverage-report binary not found in PATH after using version v1.3.1"
            exit 1
          fi
          VERSION_OUTPUT=$(go-coverage-report --version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          echo "PASS: go-coverage-report binary installed successfully for version v1.3.1"

      - name: Assert binary runs without crashing
        run: |
          go-coverage-report --help 2>&1 || true
          echo "PASS: binary executed without crashing"
