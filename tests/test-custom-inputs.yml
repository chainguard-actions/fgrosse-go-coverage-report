name: Test custom inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.0"
          coverage-artifact-name: "my-custom-coverage"
          coverage-file-name: "my-coverage.txt"
          root-package: "github.com/example/myrepo"
          skip-comment: "true"
          trim: "github.com/example/myrepo/"
          exclude: ".*_test\\.go"
          target-branch: "main"
          event-name: "push"

      - name: Assert action accepted custom inputs (fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the sentinel repo has no coverage artifacts.
          # However, it should NOT fail due to invalid custom inputs — that would be a
          # different kind of failure. We accept both success and failure here.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo has no coverage artifacts)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
