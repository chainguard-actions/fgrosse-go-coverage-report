name: Test binary download
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify go-coverage-report is not installed before action
        run: |
          if command -v go-coverage-report > /dev/null 2>&1; then
            echo "WARN: go-coverage-report already installed, test may not be meaningful"
          else
            echo "PASS: go-coverage-report not yet installed"
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.0"
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"
          target-branch: "main"

      - name: Assert go-coverage-report binary was downloaded and installed
        run: |
          echo "Checking if go-coverage-report binary is available..."
          if command -v go-coverage-report > /dev/null 2>&1; then
            echo "PASS: go-coverage-report binary is installed at $(which go-coverage-report)"
            go-coverage-report --help 2>&1 | head -5 || true
          else
            echo "FAIL: go-coverage-report binary was not installed"
            exit 1
          fi
