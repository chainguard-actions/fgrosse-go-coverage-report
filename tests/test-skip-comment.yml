name: Test skip-comment input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.5.0"
          coverage-artifact-name: "my-coverage"
          coverage-file-name: "cov.txt"
          skip-comment: "true"
          root-package: "github.com/example/repo"
          target-branch: "main"
          event-name: "push"

      - name: Assert action ran with skip-comment inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip-comment=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo - cannot download artifacts)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
