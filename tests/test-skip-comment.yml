name: Test skip-comment input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.0"
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"
          target-branch: "main"

      - name: Assert action ran with skip-comment (fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the sentinel repo has no coverage artifacts.
          # However, it should NOT fail due to skip-comment being invalid — that would be a
          # different kind of failure. We accept both success and failure here.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip-comment=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo has no coverage artifacts)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
