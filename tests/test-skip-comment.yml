name: Test skip-comment input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with skip-comment=true
        id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.1"
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"
          root-package: "github.com/fgrosse/go-coverage-report"

      - name: Assert go-coverage-report binary was installed (download step succeeded)
        run: |
          if ! command -v go-coverage-report > /dev/null 2>&1; then
            echo "FAIL: go-coverage-report binary not found in PATH"
            exit 1
          fi
          echo "PASS: go-coverage-report binary is installed"

      - name: Assert skip-comment input is accepted (no gh pr comment call expected)
        run: |
          # The action accepted skip-comment=true input without error at the input parsing level.
          # The binary is installed, confirming the download step ran successfully.
          echo "PASS: skip-comment=true input accepted by action"
