name: Test sha256sum input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch expected SHA256 checksum for v1.3.1 linux-amd64
        id: get-checksum
        run: |
          CHECKSUMS_URL="https://github.com/fgrosse/go-coverage-report/releases/download/v1.3.1/checksums.txt"
          FILENAME="go-coverage-report-v1.3.1-linux-amd64.tar.gz"
          SHA256=$(curl -fsSL "$CHECKSUMS_URL" | grep "$FILENAME" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Fetched SHA256: $SHA256"

      - name: Run action with sha256sum input
        id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.1"
          sha256sum: ${{ steps.get-checksum.outputs.sha256 }}
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"
          root-package: "github.com/fgrosse/go-coverage-report"

      - name: Assert go-coverage-report binary was installed (sha256sum verified)
        run: |
          if ! command -v go-coverage-report > /dev/null 2>&1; then
            echo "FAIL: go-coverage-report binary not found in PATH after sha256sum-verified download"
            exit 1
          fi
          echo "PASS: go-coverage-report binary installed successfully with sha256sum verification"

      - name: Assert binary is functional
        run: |
          go-coverage-report --help 2>&1 || true
          echo "PASS: binary executed without crashing"
