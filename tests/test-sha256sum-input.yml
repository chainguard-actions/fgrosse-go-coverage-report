name: Test sha256sum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get sha256sum for go-coverage-report v1.4.0 (Linux amd64)
        id: get-sha256
        run: |
          # Download the tarball and compute its sha256sum to pass as input
          URL="https://github.com/fgrosse/go-coverage-report/releases/download/v1.4.0/go-coverage-report_Linux_x86_64.tar.gz"
          TMP=$(mktemp)
          curl -sfL "$URL" -o "$TMP"
          SHA=$(sha256sum "$TMP" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          rm -f "$TMP"

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.4.0"
          sha256sum: ${{ steps.get-sha256.outputs.sha256 }}
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"

      - name: Assert action ran with sha256sum input (download step succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The download step should succeed (binary downloaded and checksum verified).
          # The coverage step may fail because there is no real PR / artifact in the sentinel repo.
          # We accept both success and failure as long as the action did not crash unexpectedly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sha256sum input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
