name: Test sha256sum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.3.1"
          # Provide a sha256sum value so the input is exercised.
          # The action will verify the downloaded binary against this checksum.
          # We intentionally pass an empty string here so the download step
          # skips checksum verification (empty sha256sum = no check), while
          # still exercising the input path. The action will then fail at the
          # coverage report step because the sentinel repo is not resolvable.
          sha256sum: ""
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"

      - name: Assert action ran (sha256sum input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo is not resolvable or no coverage artifact)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
