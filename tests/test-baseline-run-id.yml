name: Test baseline-run-id input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v1.5.0"
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          skip-comment: "true"
          baseline-run-id: "12345678"
          target-branch: "main"
          event-name: "push"

      - name: Assert action ran with explicit baseline-run-id
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo - cannot download artifacts or find run)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
