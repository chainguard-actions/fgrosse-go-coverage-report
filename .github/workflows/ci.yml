name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions: {}

jobs:
  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installs the Go version pinned in mise.toml.
      - name: Set up tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: "go"

      - name: Restore Go modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -cover -coverprofile=coverage.txt -mod=readonly ./...

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: coverage.txt

      - name: Build
        run: go build -v -mod=readonly ./...

  code_coverage:
    name: "Code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: unit_tests
    permissions:
      # Grant permission to add comments to the PR.
      pull-requests: write
      contents: read
    steps:
      # Normally,users of the action don't have to check out the source code or setup Go.
      # We need this here however because we are using a local action.yml.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: "go"

      # With version "local" the action installs the binary via "go install",
      # which honors the GOBIN that mise points at its own Go install directory.
      # Only the mise shims directory is added to the PATH of later steps, so the
      # binary would not be found. Install it into a directory that persists.
      - name: Install local binary into a directory on the PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "GOBIN=$HOME/.local/bin" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: ./
        id: coverage
        with:
          version: local
          trim: "github.com/fgrosse/go-coverage-report/"

      - name: Print coverage outputs
        env:
          TOTAL_COVERAGE: ${{ steps.coverage.outputs.total_coverage }}
          COVERAGE_DELTA: ${{ steps.coverage.outputs.coverage_delta }}
          COVERAGE_TREND: ${{ steps.coverage.outputs.coverage_trend }}
          TOTAL_STATEMENTS: ${{ steps.coverage.outputs.total_statements }}
          COVERED_STATEMENTS: ${{ steps.coverage.outputs.covered_statements }}
          MISSED_STATEMENTS: ${{ steps.coverage.outputs.missed_statements }}
        run: |
          echo "total_coverage:     $TOTAL_COVERAGE"
          echo "coverage_delta:     $COVERAGE_DELTA"
          echo "coverage_trend:     $COVERAGE_TREND"
          echo "total_statements:   $TOTAL_STATEMENTS"
          echo "covered_statements: $COVERED_STATEMENTS"
          echo "missed_statements:  $MISSED_STATEMENTS"
